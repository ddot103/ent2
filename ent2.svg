<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Same gradient as .brand-gradient: linear-gradient(135deg, #007aff 0%, #5eead4 100%) -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
  </defs>

  <!-- Rounded-lg-like background with corner radius (128 for 512px container mimics modern rounded-lg) -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />

  <!-- Trending-up arrow path inside (White, scaled & centered) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main line query paths -->
    <polyline points="128 332, 218 242, 278 302, 392 188" />
    <!-- Arrow head -->
    <polyline points="320 188, 392 188, 392 260" />
  </g>
</svg>
